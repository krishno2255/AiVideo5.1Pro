<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Video Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top left, #1f2937 0, #020617 55%);
            --color-surface: rgba(15, 23, 42, 0.9);
            --color-surface-elevated: rgba(15, 23, 42, 0.96);
            --color-border: rgba(148, 163, 184, 0.5);
            --color-border-soft: rgba(148, 163, 184, 0.25);
            --color-text: #e5e7eb;
            --color-text-muted: #9ca3af;
            --color-heading: #f9fafb;
            --color-accent: #6366f1;
            --color-accent-soft: rgba(99, 102, 241, 0.15);
            --color-accent-strong: #4f46e5;
            --color-danger: #f97373;
            --shadow-soft: 0 24px 45px rgba(15, 23, 42, 0.75);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition-fast: 0.18s ease-out;
            --transition-med: 0.28s ease;
            --input-bg: rgba(15, 23, 42, 0.9);
        }

        body.theme-light {
            --bg-gradient: radial-gradient(circle at top left, #e5ecff 0, #f9fafb 55%);
            --color-surface: rgba(255, 255, 255, 0.96);
            --color-surface-elevated: rgba(255, 255, 255, 0.99);
            --color-border: rgba(15, 23, 42, 0.12);
            --color-border-soft: rgba(15, 23, 42, 0.06);
            --color-text: #111827;
            --color-text-muted: #6b7280;
            --color-heading: #030712;
            --shadow-soft: 0 20px 40px rgba(15, 23, 42, 0.16);
            --input-bg: #f9fafb;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            background-size: cover;
            color: var(--color-text);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(16px);
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0));
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .top-nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 0, #f97316, #6366f1 60%, #0ea5e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f9fafb;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 12px 25px rgba(15, 23, 42, 0.8);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            color: var(--color-heading);
        }

        .brand-tagline {
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        .theme-toggle {
            border-radius: 999px;
            border: 1px solid var(--color-border-soft);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.6));
            color: var(--color-text);
            padding: 0.3rem 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
        }

        .theme-toggle:hover {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.9), rgba(15, 23, 42, 0.9));
            border-color: var(--color-accent);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.85);
            transform: translateY(-1px);
        }

        .theme-toggle:focus-visible,
        .tab-button:focus-visible,
        .btn:focus-visible,
        .btn-secondary:focus-visible,
        .btn-ghost:focus-visible,
        .upload-area:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
            box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.6);
        }

        .theme-toggle-dot {
            width: 16px;
            height: 16px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 30%, #facc15, #f97316 55%, #b91c1c 100%);
            box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.9);
        }

        .theme-toggle-text {
            white-space: nowrap;
        }

        .app-main {
            flex: 1;
            padding: 1.25rem 1.25rem 2.25rem;
        }

        .app-shell {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 1.5rem;
        }

        @media (min-width: 900px) {
            .app-main {
                padding: 1.75rem 1.5rem 2.75rem;
            }

            .app-shell {
                grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
                align-items: flex-start;
            }
        }

        .panel {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.9));
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border-soft);
            box-shadow: var(--shadow-soft);
            padding: 1.25rem 1.25rem 1.5rem;
            backdrop-filter: blur(24px);
        }

        body.theme-light .panel {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.98));
        }

        @media (min-width: 768px) {
            .panel {
                padding: 1.5rem 1.75rem 1.75rem;
            }
        }

        .controls-panel-header {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-heading);
            letter-spacing: 0.01em;
        }

        .panel-subtitle {
            margin: 0;
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }

        .tabs {
            margin-top: 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9));
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }

        body.theme-light .tabs {
            background: rgba(241, 245, 249, 0.9);
        }

        .tab-button {
            flex: 1 1 auto;
            border: none;
            border-radius: 999px;
            padding: 0.45rem 0.9rem;
            background: transparent;
            color: var(--color-text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            transition: color var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
        }

        .tab-button:hover {
            color: var(--color-text);
        }

        .tab-button.is-active {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-strong));
            color: #f9fafb;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.75);
            transform: translateY(-1px);
        }

        .tab-panel {
            margin-top: 1.4rem;
        }

        .tab-panel[hidden] {
            display: none;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .field-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        .field-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        .field-label span.value {
            font-weight: 600;
            color: var(--color-text);
            margin-left: 0.25rem;
        }

        .field-input,
        .field-select,
        .field-textarea {
            width: 100%;
            border-radius: 0.7rem;
            border: 1px solid var(--color-border-soft);
            background-color: var(--input-bg);
            color: var(--color-text);
            padding: 0.55rem 0.75rem;
            font-size: 0.85rem;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast), transform var(--transition-fast);
        }

        body.theme-light .field-input,
        body.theme-light .field-select,
        body.theme-light .field-textarea {
            background-color: #f9fafb;
        }

        .field-textarea {
            min-height: 130px;
            resize: vertical;
        }

        .field-input:focus,
        .field-select:focus,
        .field-textarea:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.5);
            transform: translateY(-0.5px);
        }

        .field-input::placeholder,
        .field-textarea::placeholder {
            color: var(--color-text-muted);
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        .checkbox-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            border-radius: 0.25rem;
        }

        .advanced-section {
            margin-top: 0.25rem;
        }

        .advanced-toggle {
            border: none;
            background: transparent;
            color: var(--color-text-muted);
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0;
        }

        .advanced-toggle:hover {
            color: var(--color-text);
        }

        .advanced-toggle-icon {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 1px solid var(--color-border-soft);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
        }

        .advanced-toggle[aria-expanded="true"] .advanced-toggle-icon::before {
            content: "−";
        }

        .advanced-toggle[aria-expanded="false"] .advanced-toggle-icon::before {
            content: "+";
        }

        .advanced-panel {
            margin-top: 0.4rem;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-4px);
            transition: max-height var(--transition-med), opacity var(--transition-med), transform var(--transition-med);
        }

        .advanced-panel.advanced-panel-open {
            max-height: 420px;
            opacity: 1;
            transform: translateY(0);
        }

        .seed-row {
            display: flex;
            gap: 0.5rem;
        }

        .seed-row .field-input {
            flex: 1 1 auto;
        }

        .actions-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.4rem;
            margin-top: 0.25rem;
        }

        .status-line {
            font-size: 0.78rem;
            color: var(--color-text-muted);
        }

        .status-progress {
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: radial-gradient(circle at 0 0, rgba(148, 163, 184, 0.5), transparent 55%);
            overflow: hidden;
        }

        .status-progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--color-accent), #22c55e);
            transition: width 0.22s linear;
        }

        .btn,
        .btn-primary,
        .btn-secondary,
        .btn-ghost {
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.85rem;
            padding: 0.45rem 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            background: transparent;
            color: var(--color-text);
            transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-strong));
            border-color: rgba(129, 140, 248, 0.9);
            color: #f9fafb;
            font-weight: 500;
            box-shadow: 0 16px 35px rgba(30, 64, 175, 0.9);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--color-accent-strong), #4338ca);
            transform: translateY(-1px);
            box-shadow: 0 22px 45px rgba(30, 64, 175, 0.95);
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(148, 163, 184, 0.4);
            color: var(--color-text);
        }

        .btn-secondary:hover {
            background: rgba(30, 64, 175, 0.75);
            border-color: var(--color-accent);
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.75);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            border-color: rgba(148, 163, 184, 0.2);
            color: var(--color-text-muted);
        }

        .btn-ghost:hover {
            background: rgba(15, 23, 42, 0.75);
            color: var(--color-text);
            border-color: rgba(148, 163, 184, 0.5);
        }

        .btn-xs {
            font-size: 0.75rem;
            padding: 0.3rem 0.65rem;
        }

        .text-danger {
            color: var(--color-danger);
        }

        .text-danger:hover {
            color: #fb7171;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .upload-input {
            display: none;
        }

        .upload-area {
            border-radius: var(--radius-md);
            border: 1px dashed rgba(148, 163, 184, 0.7);
            background: radial-gradient(circle at top, rgba(148, 163, 184, 0.1), transparent 60%);
            padding: 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            text-align: center;
            cursor: pointer;
            transition: border-color var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
        }

        .upload-area-title {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .upload-area-hint {
            font-size: 0.78rem;
            color: var(--color-text-muted);
        }

        .upload-area-dragover {
            border-color: var(--color-accent);
            background: radial-gradient(circle at top, rgba(129, 140, 248, 0.25), transparent 65%);
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.9);
            transform: translateY(-1px);
        }

        .image-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 230px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .image-item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0.55rem;
            border-radius: var(--radius-md);
            background: radial-gradient(circle at 0 0, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(148, 163, 184, 0.35);
        }

        body.theme-light .image-item {
            background: rgba(248, 250, 252, 0.98);
        }

        .image-thumb-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 0.5rem;
            overflow: hidden;
            background: radial-gradient(circle at 0 0, rgba(148, 163, 184, 0.5), rgba(30, 64, 175, 0.7));
        }

        .image-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-info {
            display: flex;
            flex-direction: column;
        }

        .image-name {
            margin: 0;
            font-size: 0.8rem;
            color: var(--color-text);
            word-break: break-all;
        }

        .image-item-controls {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .preview-card {
            background: var(--color-surface-elevated);
            border-radius: var(--radius-lg);
            padding: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.3);
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .preview-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 0.9rem;
            overflow: hidden;
            background-image: radial-gradient(circle at 0 0, rgba(248, 250, 252, 0.18), transparent 45%), radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.4), rgba(15, 23, 42, 1));
            background-size: cover;
            background-position: center;
        }

        .preview-thumbnail::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent 55%);
        }

        .preview-play-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .preview-play-icon::before {
            content: "▶";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.8);
            color: #e5e7eb;
            font-size: 1.4rem;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65);
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .preview-title {
            margin: 0;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--color-heading);
        }

        .preview-meta {
            margin: 0;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        .preview-timeline {
            position: relative;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: radial-gradient(circle at 0 0, rgba(148, 163, 184, 0.7), rgba(15, 23, 42, 0.95));
            overflow: hidden;
        }

        .preview-timeline-fill {
            position: absolute;
            inset: 0;
            width: 0;
            background: linear-gradient(90deg, #22c55e, #eab308, #22c55e);
            border-radius: inherit;
            transition: width 0.18s linear;
        }

        .generated-section {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .generated-header {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .section-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-heading);
        }

        .section-subtitle {
            margin: 0;
            font-size: 0.78rem;
            color: var(--color-text-muted);
        }

        .generated-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            max-height: 340px;
            overflow-y: auto;
        }

        .generated-item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 0.7rem;
            align-items: center;
            padding: 0.55rem 0.7rem;
            border-radius: var(--radius-md);
            background: radial-gradient(circle at 0 0, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(148, 163, 184, 0.4);
        }

        body.theme-light .generated-item {
            background: rgba(248, 250, 252, 0.98);
        }

        .generated-thumb {
            width: 56px;
            height: 40px;
            border-radius: 0.5rem;
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.7);
        }

        .generated-main {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .generated-main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
        }

        .generated-title {
            margin: 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--color-heading);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .generated-meta {
            margin: 0;
            font-size: 0.78rem;
            color: var(--color-text-muted);
        }

        .generated-actions {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        @media (min-width: 640px) {
            .generated-actions {
                flex-direction: row;
            }
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 999px;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .status-queued .status-badge {
            background: rgba(148, 163, 184, 0.1);
            border-color: rgba(148, 163, 184, 0.5);
            color: var(--color-text-muted);
        }

        .status-processing .status-badge {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.85);
            color: #0ea5e9;
        }

        .status-complete .status-badge {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.9);
            color: #22c55e;
        }

        .status-failed .status-badge {
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.9);
            color: #f97373;
        }

        @media (max-width: 600px) {
            .top-nav-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions-row {
                align-items: stretch;
            }

            .seed-row {
                flex-direction: column;
            }

            .generated-item,
            .image-item {
                grid-template-columns: minmax(0, 1fr);
            }

            .generated-actions,
            .image-item-controls {
                flex-direction: row;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

    <script>
        (function () {
            "use strict";

            var body = document.body;
            var themeToggle = document.getElementById("themeToggle");
            var themeToggleText = themeToggle ? themeToggle.querySelector(".theme-toggle-text") : null;

            function getStoredTheme() {
                try {
                    return window.localStorage ? window.localStorage.getItem("ai-video-studio-theme") : null;
                } catch (error) {
                    return null;
                }
            }

            function setStoredTheme(theme) {
                try {
                    if (window.localStorage) {
                        window.localStorage.setItem("ai-video-studio-theme", theme);
                    }
                } catch (error) {
                    // ignore storage errors
                }
            }

            function applyTheme(theme) {
                if (theme === "light") {
                    body.classList.remove("theme-dark");
                    body.classList.add("theme-light");
                    if (themeToggleText) {
                        themeToggleText.textContent = "Light mode";
                    }
                    if (themeToggle) {
                        themeToggle.setAttribute("aria-pressed", "false");
                    }
                } else {
                    body.classList.remove("theme-light");
                    body.classList.add("theme-dark");
                    if (themeToggleText) {
                        themeToggleText.textContent = "Dark mode";
                    }
                    if (themeToggle) {
                        themeToggle.setAttribute("aria-pressed", "true");
                    }
                }
                setStoredTheme(theme);
            }

            (function initTheme() {
                var stored = getStoredTheme();
                var prefersDark = false;
                try {
                    prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                } catch (error) {
                    prefersDark = true;
                }
                if (stored === "light" || stored === "dark") {
                    applyTheme(stored);
                } else {
                    applyTheme(prefersDark ? "dark" : "light");
                }
            })();

            if (themeToggle) {
                themeToggle.addEventListener("click", function () {
                    var isDark = body.classList.contains("theme-dark");
                    applyTheme(isDark ? "light" : "dark");
                });
            }

            var tabButtons = document.querySelectorAll(".tab-button");
            var tabsContainer = document.querySelector(".tabs");

            function activateTab(button) {
                if (!button) {
                    return;
                }
                var targetPanelId = button.getAttribute("aria-controls");
                tabButtons.forEach(function (tab) {
                    var isActive = tab === button;
                    tab.classList.toggle("is-active", isActive);
                    tab.setAttribute("aria-selected", isActive ? "true" : "false");
                    tab.setAttribute("tabindex", isActive ? "0" : "-1");
                    var panelId = tab.getAttribute("aria-controls");
                    var panel = document.getElementById(panelId);
                    if (panel) {
                        panel.hidden = !isActive;
                    }
                });
                if (targetPanelId) {
                    var firstField = document.querySelector("#" + targetPanelId + " .field-input, #" + targetPanelId + " .field-select, #" + targetPanelId + " .field-textarea");
                    if (firstField) {
                        firstField.setAttribute("tabindex", "0");
                    }
                }
            }

            tabButtons.forEach(function (button) {
                button.addEventListener("click", function () {
                    activateTab(button);
                });
            });

            if (tabsContainer) {
                tabsContainer.addEventListener("keydown", function (event) {
                    var key = event.key;
                    if (key !== "ArrowRight" && key !== "ArrowLeft") {
                        return;
                    }
                    event.preventDefault();
                    var currentIndex = Array.prototype.indexOf.call(tabButtons, document.activeElement);
                    if (currentIndex === -1) {
                        return;
                    }
                    var direction = key === "ArrowRight" ? 1 : -1;
                    var nextIndex = currentIndex + direction;
                    if (nextIndex < 0) {
                        nextIndex = tabButtons.length - 1;
                    }
                    if (nextIndex >= tabButtons.length) {
                        nextIndex = 0;
                    }
                    var nextTab = tabButtons[nextIndex];
                    activateTab(nextTab);
                    nextTab.focus();
                });
            }

            function setupAdvancedToggle(toggleId, panelId) {
                var toggle = document.getElementById(toggleId);
                var panel = document.getElementById(panelId);
                if (!toggle || !panel) {
                    return;
                }
                toggle.addEventListener("click", function () {
                    var isExpanded = toggle.getAttribute("aria-expanded") === "true";
                    toggle.setAttribute("aria-expanded", String(!isExpanded));
                    panel.setAttribute("aria-hidden", String(isExpanded));
                    panel.classList.toggle("advanced-panel-open", !isExpanded);
                });
            }

            setupAdvancedToggle("textAdvancedToggle", "textAdvancedPanel");

            var textGuidance = document.getElementById("textGuidance");
            var textGuidanceValue = document.getElementById("textGuidanceValue");
            if (textGuidance && textGuidanceValue) {
                var updateGuidance = function () {
                    textGuidanceValue.textContent = textGuidance.value;
                };
                updateGuidance();
                textGuidance.addEventListener("input", updateGuidance);
            }

            var imageDuration = document.getElementById("imageDuration");
            var imageDurationValue = document.getElementById("imageDurationValue");
            if (imageDuration && imageDurationValue) {
                var updateImageDuration = function () {
                    imageDurationValue.textContent = imageDuration.value + "s";
                };
                updateImageDuration();
                imageDuration.addEventListener("input", updateImageDuration);
            }

            var textSeed = document.getElementById("textSeed");
            var textRandomSeed = document.getElementById("textRandomSeed");
            if (textSeed && textRandomSeed) {
                textRandomSeed.addEventListener("click", function () {
                    var random = Math.floor(Math.random() * 1000000000);
                    textSeed.value = String(random);
                });
            }

            var imageDropArea = document.getElementById("imageDropArea");
            var imageInput = document.getElementById("imageInput");
            var imageList = document.getElementById("imageList");

            function preventDefaults(event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (imageDropArea) {
                ["dragenter", "dragover"].forEach(function (eventName) {
                    imageDropArea.addEventListener(eventName, function (event) {
                        preventDefaults(event);
                        imageDropArea.classList.add("upload-area-dragover");
                    });
                });

                ["dragleave", "drop"].forEach(function (eventName) {
                    imageDropArea.addEventListener(eventName, function (event) {
                        preventDefaults(event);
                        if (eventName === "drop") {
                            var files = Array.prototype.slice.call(event.dataTransfer.files || []);
                            handleImageFiles(files);
                        }
                        imageDropArea.classList.remove("upload-area-dragover");
                    });
                });
            }

            if (imageInput) {
                imageInput.addEventListener("change", function (event) {
                    var files = Array.prototype.slice.call(event.target.files || []);
                    handleImageFiles(files);
                    imageInput.value = "";
                });
            }

            function handleImageFiles(files) {
                if (!files || !files.length || !imageList) {
                    return;
                }
                files.forEach(function (file) {
                    if (!file.type || !file.type.startsWith("image/")) {
                        return;
                    }
                    addImageListItem(file);
                });
            }

            function addImageListItem(file) {
                if (!imageList) {
                    return;
                }
                var li = document.createElement("li");
                li.className = "image-item";

                var thumbWrapper = document.createElement("div");
                thumbWrapper.className = "image-thumb-wrapper";

                var img = document.createElement("img");
                img.className = "image-thumb";
                img.alt = file.name;

                var reader = new FileReader();
                reader.addEventListener("load", function (event) {
                    img.src = String(event.target && event.target.result || "");
                });
                reader.readAsDataURL(file);

                thumbWrapper.appendChild(img);

                var info = document.createElement("div");
                info.className = "image-info";

                var nameEl = document.createElement("p");
                nameEl.className = "image-name";
                nameEl.textContent = file.name;

                info.appendChild(nameEl);

                var controls = document.createElement("div");
                controls.className = "image-item-controls";

                var upButton = document.createElement("button");
                upButton.type = "button";
                upButton.className = "btn-ghost btn-xs";
                upButton.textContent = "Move up";
                upButton.addEventListener("click", function () {
                    var previous = li.previousElementSibling;
                    if (previous) {
                        imageList.insertBefore(li, previous);
                    }
                });

                var downButton = document.createElement("button");
                downButton.type = "button";
                downButton.className = "btn-ghost btn-xs";
                downButton.textContent = "Move down";
                downButton.addEventListener("click", function () {
                    var next = li.nextElementSibling;
                    if (next) {
                        imageList.insertBefore(next, li);
                    }
                });

                var removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "btn-ghost btn-xs text-danger";
                removeButton.textContent = "Remove";
                removeButton.addEventListener("click", function () {
                    li.remove();
                });

                controls.appendChild(upButton);
                controls.appendChild(downButton);
                controls.appendChild(removeButton);

                li.appendChild(thumbWrapper);
                li.appendChild(info);
                li.appendChild(controls);
                imageList.appendChild(li);
            }

            var generatedList = document.getElementById("generatedList");
            var previewThumbnail = document.getElementById("previewThumbnail");
            var previewTitle = document.getElementById("previewTitle");
            var previewMeta = document.getElementById("previewMeta");
            var previewTimeline = document.getElementById("previewTimeline");
            var previewTimelineFill = document.getElementById("previewTimelineFill");

            function pad(number) {
                return String(number).padStart(2, "0");
            }

            function formatTimestamp(date) {
                return (
                    date.getFullYear() +
                    "-" +
                    pad(date.getMonth() + 1) +
                    "-" +
                    pad(date.getDate()) +
                    " " +
                    pad(date.getHours()) +
                    ":" +
                    pad(date.getMinutes()) +
                    ":" +
                    pad(date.getSeconds())
                );
            }

            var thumbColors = [
                "#6366f1",
                "#ec4899",
                "#22c55e",
                "#0ea5e9",
                "#f97316",
                "#8b5cf6",
                "#facc15"
            ];

            function getRandomThumbGradient() {
                var color = thumbColors[Math.floor(Math.random() * thumbColors.length)];
                return "linear-gradient(135deg, " + color + ", rgba(15, 23, 42, 1))";
            }

            function setItemStatus(li, status) {
                if (!li) {
                    return;
                }
                li.dataset.status = status;
                var normalized = status.toLowerCase();
                li.classList.remove("status-queued", "status-processing", "status-complete", "status-failed");
                li.classList.add("status-" + normalized);
                var badge = li.querySelector(".status-badge");
                if (badge) {
                    badge.textContent = status;
                    badge.className = "status-badge status-" + normalized;
                }
            }

            function createVideoListItem(options) {
                if (!generatedList) {
                    return null;
                }
                var li = document.createElement("li");
                li.className = "generated-item status-queued";
                li.dataset.title = options.title;
                li.dataset.mode = options.mode;
                li.dataset.duration = options.duration;
                li.dataset.resolution = options.resolution;
                li.dataset.aspect = options.aspect;
                li.dataset.style = options.style;
                li.dataset.status = "Queued";

                var thumb = document.createElement("div");
                thumb.className = "generated-thumb";
                thumb.style.backgroundImage = getRandomThumbGradient();

                var main = document.createElement("div");
                main.className = "generated-main";

                var header = document.createElement("div");
                header.className = "generated-main-header";

                var titleEl = document.createElement("h3");
                titleEl.className = "generated-title";
                titleEl.textContent = options.title;

                var statusBadge = document.createElement("span");
                statusBadge.className = "status-badge status-queued";
                statusBadge.textContent = "Queued";

                header.appendChild(titleEl);
                header.appendChild(statusBadge);

                var meta = document.createElement("p");
                meta.className = "generated-meta";
                meta.textContent =
                    options.duration +
                    " • " +
                    options.resolution +
                    " • " +
                    options.aspect +
                    " • " +
                    options.style;

                main.appendChild(header);
                main.appendChild(meta);

                var actions = document.createElement("div");
                actions.className = "generated-actions";

                var playButton = document.createElement("button");
                playButton.type = "button";
                playButton.className = "btn-secondary btn-xs";
                playButton.textContent = "Play";

                var downloadButton = document.createElement("button");
                downloadButton.type = "button";
                downloadButton.className = "btn-ghost btn-xs";
                downloadButton.textContent = "Download";

                var deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "btn-ghost btn-xs text-danger";
                deleteButton.textContent = "Delete";

                actions.appendChild(playButton);
                actions.appendChild(downloadButton);
                actions.appendChild(deleteButton);

                li.appendChild(thumb);
                li.appendChild(main);
                li.appendChild(actions);

                if (generatedList.firstChild) {
                    generatedList.insertBefore(li, generatedList.firstChild);
                } else {
                    generatedList.appendChild(li);
                }

                playButton.addEventListener("click", function () {
                    updatePreviewFromItem(li);
                    window.alert("Playing video: " + options.title);
                });

                downloadButton.addEventListener("click", function () {
                    window.alert("Downloading " + options.title);
                });

                deleteButton.addEventListener("click", function () {
                    var isCurrent = previewTitle && previewTitle.textContent === options.title;
                    li.remove();
                    if (isCurrent && previewTitle && previewMeta && previewThumbnail) {
                        previewTitle.textContent = "No video selected";
                        previewMeta.textContent = "Generate a video to see it here.";
                        previewThumbnail.style.backgroundImage = "";
                    }
                });

                return li;
            }

            var previewPlayInterval = null;

            function updatePreviewFromItem(li) {
                if (!li || !previewTitle || !previewMeta || !previewThumbnail || !previewTimeline || !previewTimelineFill) {
                    return;
                }
                var title = li.dataset.title || "Untitled video";
                var duration = li.dataset.duration || "--";
                var resolution = li.dataset.resolution || "--";
                var aspect = li.dataset.aspect || "--";
                var style = li.dataset.style || "";

                previewTitle.textContent = title;
                previewMeta.textContent = duration + " • " + resolution + " • " + aspect + (style ? " • " + style : "");

                var sourceThumb = li.querySelector(".generated-thumb");
                if (sourceThumb) {
                    var computed = window.getComputedStyle(sourceThumb);
                    previewThumbnail.style.backgroundImage = computed.backgroundImage;
                }

                if (previewPlayInterval) {
                    window.clearInterval(previewPlayInterval);
                }

                var progress = 0;
                previewTimelineFill.style.width = "0%";
                previewTimeline.setAttribute("aria-valuenow", "0");

                previewPlayInterval = window.setInterval(function () {
                    progress += 4;
                    if (progress >= 100) {
                        progress = 100;
                        window.clearInterval(previewPlayInterval);
                    }
                    previewTimelineFill.style.width = progress + "%";
                    previewTimeline.setAttribute("aria-valuenow", String(progress));
                }, 80);
            }

            var textStatus = document.getElementById("textStatus");
            var textProgress = document.getElementById("textProgress");
            var imageStatus = document.getElementById("imageStatus");
            var imageProgress = document.getElementById("imageProgress");

            var textPrompt = document.getElementById("textPrompt");
            var textDuration = document.getElementById("textDuration");
            var textAspect = document.getElementById("textAspect");
            var textResolution = document.getElementById("textResolution");
            var textCameraMovement = document.getElementById("textCameraMovement");
            var textCameraAngle = document.getElementById("textCameraAngle");
            var textVisualStyle = document.getElementById("textVisualStyle");
            var textFrameRate = document.getElementById("textFrameRate");

            var imageTransition = document.getElementById("imageTransition");
            var imageCameraMovement = document.getElementById("imageCameraMovement");

            function simulateGeneration(mode) {
                var now = new Date();
                var titlePrefix = mode === "text" ? "Text Video - " : "Image Video - ";
                var title = titlePrefix + formatTimestamp(now);

                var duration;
                var resolution;
                var aspect;
                var style;

                if (mode === "text") {
                    duration = textDuration ? textDuration.value : "10s";
                    resolution = textResolution ? textResolution.value : "1080p";
                    aspect = textAspect ? textAspect.value : "16:9";
                    var vs = textVisualStyle ? textVisualStyle.value : "Cinematic";
                    var fr = textFrameRate ? textFrameRate.value : "24 fps";
                    style = vs + ", " + fr;
                } else {
                    var perImage = imageDuration ? imageDuration.value + "s / image" : "3s / image";
                    duration = perImage;
                    resolution = "1080p";
                    aspect = "16:9";
                    var transition = imageTransition ? imageTransition.value : "Cut";
                    var cam = imageCameraMovement ? imageCameraMovement.value : "Static";
                    style = "Transition: " + transition + ", Camera: " + cam;
                }

                var options = {
                    title: title,
                    mode: mode === "text" ? "Text" : "Image",
                    duration: duration,
                    resolution: resolution,
                    aspect: aspect,
                    style: style
                };

                var statusEl = mode === "text" ? textStatus : imageStatus;
                var progressEl = mode === "text" ? textProgress : imageProgress;

                if (!statusEl || !progressEl) {
                    return;
                }

                var item = createVideoListItem(options);
                if (!item) {
                    return;
                }

                statusEl.textContent = "Queued...";
                progressEl.style.width = "0%";
                setItemStatus(item, "Queued");

                window.setTimeout(function () {
                    setItemStatus(item, "Processing");
                    animateGeneration(statusEl, progressEl, item);
                }, 400);
            }

            function animateGeneration(statusEl, progressEl, item) {
                var progress = 0;
                statusEl.textContent = "Generating... 0%";
                progressEl.style.width = "0%";

                var interval = window.setInterval(function () {
                    progress += Math.floor(Math.random() * 12) + 8;
                    if (progress >= 100) {
                        progress = 100;
                    }
                    statusEl.textContent = "Generating... " + progress + "%";
                    progressEl.style.width = progress + "%";

                    if (progress >= 100) {
                        window.clearInterval(interval);
                        statusEl.textContent = "Complete";
                        setItemStatus(item, "Complete");
                        window.setTimeout(function () {
                            progressEl.style.width = "0%";
                        }, 700);
                        updatePreviewFromItem(item);
                    }
                }, 260);
            }

            var generateTextVideoButton = document.getElementById("generateTextVideo");
            var generateImageVideoButton = document.getElementById("generateImageVideo");

            if (generateTextVideoButton) {
                generateTextVideoButton.addEventListener("click", function (event) {
                    event.preventDefault();
                    simulateGeneration("text");
                });
            }

            if (generateImageVideoButton) {
                generateImageVideoButton.addEventListener("click", function (event) {
                    event.preventDefault();
                    simulateGeneration("image");
                });
            }
        })();
    </script>
</body>
</html>
